<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الوقت التفاعلي - مع الأرقام</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3436;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 850px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 25px;
            text-align: center;
            border: 6px solid #ffeaa7;
        }
        h1 {
            color: #d63031;
            margin-bottom: 5px;
            font-size: 26px;
        }
        p.subtitle {
            color: #636e72;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .clocks-grid {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }
        .clock-card {
            background: #f1f2f6;
            border-radius: 20px;
            padding: 15px;
            width: 330px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 3px solid #dfe4ea;
        }
        .clock-title {
            font-weight: bold;
            font-size: 18px;
            color: #2f3542;
            margin-bottom: 10px;
        }
        /* تصميم الساعة التناظرية مع الأرقام */
        .analog-clock {
            width: 200px;
            height: 200px;
            background: white;
            border: 8px solid #2f3542;
            border-radius: 50%;
            margin: 0 auto 15px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        /* الأرقام على الساعة */
        .clock-number {
            position: absolute;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            font-size: 16px;
            color: #2d3436;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 5px;
        }
        .hour-hand {
            width: 6px;
            height: 55px;
            background: #ff4757;
            transform: translateX(-50%) rotate(0deg);
            z-index: 3;
        }
        .minute-hand {
            width: 4px;
            height: 75px;
            background: #2ed573;
            transform: translateX(-50%) rotate(0deg);
            z-index: 2;
        }
        .clock-center {
            width: 12px;
            height: 12px;
            background: #2f3542;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }
        .digital-display {
            font-size: 22px;
            font-weight: bold;
            color: #0984e3;
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 2px dashed #74b9ff;
        }
        /* لوحة التحكم والعمليات */
        .controls-panel {
            background: #dfe6e9;
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        label {
            font-weight: bold;
            font-size: 16px;
            color: #2d3436;
        }
        select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #b2bec3;
            font-family: inherit;
        }
        .btn-op {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #00896f;
        }
        .btn-op:hover { background-color: #55efc4; }
        .btn-op:active { transform: translateY(4px); box-shadow: none; }
        .btn-minus {
            background-color: #e17055;
            box-shadow: 0 4px 0 #c0392b;
        }
        .btn-minus:hover { background-color: #fab1a0; }
        .info-msg {
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
            color: #d63031;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏰ مختبر الوقت التفاعلي</h1>
        <p class="subtitle">الساعات الآن تحتوي على الأرقام الحقيقية من 1 إلى 12 لتسهيل القراءة والتعلم!</p>

        <div class="clocks-grid">
            <!-- الساعة الأولى -->
            <div class="clock-card">
                <div class="clock-title">⌚ الساعة الأصلية (البداية)</div>
                <div class="analog-clock" id="clock1">
                    <!-- العقارب -->
                    <div class="hand hour-hand" id="hourHand1"></div>
                    <div class="hand minute-hand" id="minuteHand1"></div>
                    <div class="clock-center"></div>
                </div>
                <div class="digital-display" id="digital1">12:00</div>
            </div>

            <!-- الساعة الثانية -->
            <div class="clock-card" style="border-color: #55efc4;">
                <div class="clock-title" style="color: #00b894;">✨ ساعة النتيجة (بعد العملية)</div>
                <div class="analog-clock" id="clock2">
                    <!-- العقارب -->
                    <div class="hand hour-hand" id="hourHand2"></div>
                    <div class="hand minute-hand" id="minuteHand2"></div>
                    <div class="clock-center"></div>
                </div>
                <div class="digital-display" id="digital2" style="color: #00b894; border-color: #55efc4;">12:00</div>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div class="controls-panel">
            <div class="control-group">
                <label>تعديل الساعات:</label>
                <select id="selectHour" onchange="updateCustomTime()">
                    <!-- يتم تعبئتها بـ JavaScript -->
                </select>
                <label>تعديل الدقائق:</label>
                <select id="selectMinute" onchange="updateCustomTime()">
                    <!-- يتم تعبئتها بـ JavaScript -->
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">

            <div class="control-group">
                <label>اختر الفترة الزمنية:</label>
                <select id="timeDelta">
                    <option value="5">5 دقائق</option>
                    <option value="10">10 دقائق</option>
                    <option value="15">15 دقيقة</option>
                    <option value="20">20 دقيقة</option>
                    <option value="25">25 دقيقة</option>
                    <option value="30" selected>30 دقيقة (نصف ساعة)</option>
                    <option value="35">35 دقيقة</option>
                    <option value="40">40 دقيقة</option>
                    <option value="45">45 دقيقة (ثلاث أرباع الساعة)</option>
                    <option value="50">50 دقيقة</option>
                    <option value="55">55 دقيقة</option>
                </select>
            </div>

            <div class="control-group" style="gap: 15px; margin-top: 15px;">
                <button class="btn-op" onclick="calculateTime('add')">➕ جمع الوقت (إضافة)</button>
                <button class="btn-op btn-minus" onclick="calculateTime('subtract')">➖ طرح الوقت (إنقاص)</button>
            </div>

            <div class="info-msg" id="infoMsg">اختر الوقت والعملية للاستكشاف!</div>
        </div>
    </div>

    <script>
        // دالة لإنشاء الأرقام من 1 إلى 12 تلقائياً في الساعات التناظرية
        function createClockNumbers(clockElementId) {
            const clock = document.getElementById(clockElementId);
            // نصف القطر للمركز (نصف الـ 200px ناقص هامش بسيط)
            const radius = 75; 
            const centerX = 100; // منتصف الـ 200px
            const centerY = 100;

            for (let i = 1; i <= 12; i++) {
                // حساب الزاوية لكل رقم (كل رقم يبعد 30 درجة، ونبدأ من الأعلى بإزاحة -90 درجة)
                let angle = (i * 30 - 90) * (Math.PI / 180);
                let x = centerX + radius * Math.cos(angle) - 15; // طرح 15 لنصف عرض العنصر
                let y = centerY + radius * Math.sin(angle) - 15; // طرح 15 لنصف ارتفاع العنصر

                let numDiv = document.createElement('div');
                numDiv.className = 'clock-number';
                numDiv.innerText = i;
                numDiv.style.left = `${x}px`;
                numDiv.style.top = `${y}px`;
                clock.appendChild(numDiv);
            }
        }

        // إنشاء الأرقام للساعتين
        createClockNumbers('clock1');
        createClockNumbers('clock2');

        // إعداد خيارات الساعات (من 1 إلى 12)
        const hourSelect = document.getElementById('selectHour');
        for (let i = 1; i <= 12; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = i + " ساعات";
            hourSelect.appendChild(opt);
        }

        // إعداد خيارات الدقائق (مضاعفات الـ 5)
        const minuteSelect = document.getElementById('selectMinute');
        for (let i = 0; i < 60; i += 5) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = (i < 10 ? "0" + i : i) + " دقيقة";
            minuteSelect.appendChild(opt);
        }

        let currentTotalMinutes = 12 * 60;

        function updateClockDisplay(totalMins, hourHandId, minHandId, digitalId) {
            totalMins = (totalMins + 720) % 720;
            let hours = Math.floor(totalMins / 60);
            let minutes = totalMins % 60;
            if (hours === 0) hours = 12;

            let minuteAngle = minutes * 6;
            let hourAngle = (hours % 12) * 30 + minutes * 0.5;

            document.getElementById(minHandId).style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
            document.getElementById(hourHandId).style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

            let formattedMin = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById(digitalId).innerText = `${hours}:${formattedMin}`;

            return totalMins;
        }

        function updateCustomTime() {
            let h = parseInt(hourSelect.value);
            let m = parseInt(minuteSelect.value);
            if (h === 12) h = 0;
            currentTotalMinutes = (h * 60) + m;
            
            updateClockDisplay(currentTotalMinutes, 'hourHand1', 'minuteHand1', 'digital1');
            updateClockDisplay(currentTotalMinutes, 'hourHand2', 'minuteHand2', 'digital2');
            document.getElementById('infoMsg').innerText = "تم تحديث الوقت الأساسي بنجاح!";
        }

        function calculateTime(operation) {
            let delta = parseInt(document.getElementById('timeDelta').value);
            let newTotalMinutes;
            let opText = "";

            if (operation === 'add') {
                newTotalMinutes = currentTotalMinutes + delta;
                opText = `إضافة ${delta} دقيقة`;
            } else {
                newTotalMinutes = currentTotalMinutes - delta;
                opText = `طرح ${delta} دقيقة`;
            }

            updateClockDisplay(newTotalMinutes, 'hourHand2', 'minuteHand2', 'digital2');
            document.getElementById('infoMsg').innerText = `✅ تمت عملية (${opText}) بنجاح!`;
        }

        updateCustomTime();
    </script>

</body>
</html>
