<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بطل الوقت الصغير</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2d3436;
        }
        .game-container {
            background: #ffffff;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 20px;
            text-align: center;
            border: 5px solid #ffeaa7;
        }
        h1 {
            color: #d63031;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #e17055;
            margin-bottom: 15px;
        }
        .question-box {
            background: #dfe6e9;
            border-radius: 15px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3436;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #00896f;
        }
        .btn:hover {
            background-color: #55efc4;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        #feedback {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }
        .character {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="character">🦊 سنجوب الذكي</div>
        <h1>بطل الوقت الصغير</h1>
        <div class="score-board">النجوم: <span id="stars"> ⭐ 0</span> | المستوي: <span id="level">1 / 3</span></div>
        
        <div class="question-box" id="question-text">
            جاري تحميل السؤال...
        </div>

        <div class="options-grid" id="options-container">
            <!-- أزرار الخيارات ستظهر هنا -->
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        const questions = [
            // المحور 1: قراءة الساعة
            {
                level: 1,
                text: "أشارت ساعة الحائط إلى عقرب ساعات قصير عند الرقم 3 وعقرب دقائق طويل عند الرقم 12. ما هو هذا الوقت؟",
                options: ["3:00 تماماً", "12:03", "3:30", "12:00"],
                correct: "3:00 تماماً"
            },
            {
                level: 1,
                text: "وقت الاستيقاظ صباحاً: عقرب الساعات عند 7 وعقرب الدقائق عند 12. كم الساعة؟",
                options: ["12:07", "7:00 صباحاً", "7:30", "6:00"],
                correct: "7:00 صباحاً"
            },
            // المحور 2: جمع الوقت (باستخدام الفترات المحددة)
            {
                level: 2,
                text: "بدأت حصة الرياضيات الساعة 9:00 صباحاً واستمرت لمدة **30 دقيقة**. متى انتهت الحصة؟",
                options: ["9:30 صباحاً", "10:00 صباحاً", "9:15 صباحاً", "9:45 صباحاً"],
                correct: "9:30 صباحاً"
            },
            {
                level: 2,
                text: "ذهب سنجوب في رحلة استراحة قصيرة الساعة 10:00 واستغرقت **20 دقيقة**. متى انتهت الاستراحة؟",
                options: ["10:15", "10:20", "10:40", "11:00"],
                correct: "10:20"
            },
            {
                level: 2,
                text: "بدأ وقت اللعب الساعة 4:00 عصراً وأضفنا إليه **45 دقيقة**. متى ينتهي وقت اللعب؟",
                options: ["4:30", "4:45", "5:00", "5:15"],
                correct: "4:45"
            },
            // المحور 3: طرح الوقت (باستخدام الفترات المحددة)
            {
                level: 3,
                text: "تشير الساعة الآن إلى 2:00 ظهراً، ووقت انتهاء النشاط كان قبل **15 دقيقة**. متى بدأ النشاط؟",
                options: ["1:45 ظهراً", "2:15 ظهراً", "1:30 ظهراً", "2:00 ظهراً"],
                correct: "1:45 ظهراً"
            },
            {
                level: 3,
                text: "الوقت الحالي 5:00 مساءً، الفرق الزمني منذ بداية القصة هو **40 دقيقة**. متى بدأت القصة؟",
                options: ["4:30 مساءً", "4:20 مساءً", "4:15 مساءً", "5:40 مساءً"],
                correct: "4:20 مساءً"
            },
            {
                level: 3,
                text: "ينتهي اليوم الدراسي الساعة 1:00 ظهراً، وحصة الأنشطة الأخيرة استغرقت **50 دقيقة**. متى بدأت الحصة تقريباً كفارق؟",
                options: ["12:10 ظهراً", "12:30 ظهراً", "1:50 ظهراً", "12:00 ظهراً"],
                correct: "12:10 ظهراً"
            }
        ];

        let currentIdx = 0;
        let score = 0;

        function loadQuestion() {
            if (currentIdx >= questions.length) {
                document.querySelector('.game-container').innerHTML = `
                    <div class="character">🏆</div>
                    <h1>تهانينا يا بطل!</h1>
                    <p style="font-size: 22px;">لقد أنهيت جميع التحديات بنجاح وجمعت ${score} من ${questions.length} نجوم!</p>
                    <button class="btn" onclick="location.reload()">العب مرة أخرى</button>
                `;
                return;
            }

            let q = questions[currentIdx];
            document.getElementById('question-text').innerHTML = q.text;
            document.getElementById('stars').innerText = ` ⭐ ${score}`;
            document.getElementById('level').innerText = `${q.level} / 3`;
            document.getElementById('feedback').innerText = '';

            let optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // خلط الخيارات عشوائياً لزيادة المتعة
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                let btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(option, q.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            let feedback = document.getElementById('feedback');
            if (selected === correct) {
                feedback.style.color = '#00b894';
                feedback.innerText = '🎉 إجابة صحيحة! أحسنت يا بطل!';
                score++;
                setTimeout(() => {
                    currentIdx++;
                    loadQuestion();
                }, 1500);
            } else {
                feedback.style.color = '#d63031';
                feedback.innerText = '❌ إجابة خاطئة، حاول مرة أخرى!';
            }
        }

        // تشغيل اللعبة عند فتح الصفحة
        loadQuestion();
    </script>

</body>
</html>
